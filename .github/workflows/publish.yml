name: Publish to npm

# Publishes to npm when a GitHub Release is published. Create a release whose
# tag matches the version in package.json (e.g. tag "0.0.1").
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm provenance attestation

jobs:
  publish:
    name: Test & publish
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/newsdata-nodejs-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Run tests
        run: npm test

      # Guard against publishing a tag that doesn't match package.json.
      - name: Verify tag matches package version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::Release tag '$TAG' does not match package.json version '$PKG_VERSION'"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          # Create a granular automation token at
          #   https://www.npmjs.com/settings/<user-or-org>/tokens
          # and add it as the repo secret NPM_TOKEN.
          #
          # Alternatively, once the package exists on npm you can switch to
          # tokenless OIDC trusted publishing (npm >= 11.5.1): configure a
          # Trusted Publisher for this repo/workflow at
          #   https://www.npmjs.com/package/newsdata-nodejs-client/access
          # and remove this NODE_AUTH_TOKEN line.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
